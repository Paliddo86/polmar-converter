name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-win64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Configure line endings
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            file

      - name: Build
        shell: msys2 {0}
        run: |
          sh ./build_win.sh
          file dist/polmar-convert-win64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/
          if-no-files-found: error

  build-win32:
    name: Build Windows x86
    runs-on: windows-latest
    steps:
      - name: Configure line endings
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSYS2 (MINGW32)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: >-
            mingw-w64-i686-gcc
            file

      - name: Build
        shell: msys2 {0}
        run: |
          sh ./build_win.sh
          file dist/polmar-convert-win32.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-win64, build-win32]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Package release
        run: |
          cd dist
          sha256sum polmar-convert-win64.exe polmar-convert-win32.exe > SHA256SUMS.txt
          cp ../README.md ../LEGGIMI.txt ../LICENSE .
          zip -9 polmar-convert-windows.zip \
            polmar-convert-win64.exe \
            polmar-convert-win32.exe \
            README.md \
            LEGGIMI.txt \
            LICENSE \
            SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/polmar-convert-windows.zip \
              dist/polmar-convert-win64.exe \
              dist/polmar-convert-win32.exe \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              dist/polmar-convert-windows.zip \
              dist/polmar-convert-win64.exe \
              dist/polmar-convert-win32.exe \
              dist/SHA256SUMS.txt \
              --title "Polmar Easy 2 Converter $TAG" \
              --generate-notes
          fi
